title: Elizabeth "Eli" Margolin
author: Eli Margolin
interests: >
  I'm a PhD candidate at the University of Pennsylvania advised by
  [Sebastian Angel](https://www.cis.upenn.edu/~sga001/), where I build
  **zero-knowledge proof systems**. I designed and performance-optimized the
  provers and circuits behind [Reef](https://github.com/eniac/Reef) (USENIX
  Security 2024) and [Coral](https://github.com/eniac/coral) (IEEE S&P 2026),
  working primarily in **Rust** and **C++**. My current focus is using
  cryptographic tools, including zero-knowledge proofs, to make AI systems
  **auditable and accountable**. I'm always open to collaboration or discussions
  about cryptography, privacy, and security — feel free to reach out!
bio: >
  Before starting my PhD I spent 3 years as a Security Engineer at Meta, building
  company-wide insider-threat and abuse-detection tooling. During my Master's at
  Duke University I was fortunate to work on differential privacy with
  [Ashwin Machanavajjhala](https://users.cs.duke.edu/~ashwin/) and
  [Charles Becker](https://sites.duke.edu/charlesbecker/); I completed my
  Bachelor's at Stanford. I'm originally from New Orleans and spend my free time
  rowing with [Vesper Boat Club](https://vesperboatclub.org/) and
  [Team USA](https://usrowing.org/rosters/2025-senior/eli-margolin).
email: ecmargo@seas.upenn.edu
description: Zero-knowledge proofs, zkSNARK, applied cryptography, Rust, C++, formal methods, Coq, security engineer, differential privacy, AI auditability, Reef, Coral, Eli Margolin, Elizabeth, Penn, Stanford, Duke, Meta
show_excerpts: true # set to true to show excerpts on the homepage

